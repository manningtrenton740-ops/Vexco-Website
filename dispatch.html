<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexco LLC | Dispatch & Service Queue</title>
    <style>
        :root {
            --bauer-red: #cc0000;
            --bauer-red-dark: #990000;
            --gilded-brass: #C5A059;
            --gilded-brass-light: #dfbe7d;
            --dark-bg: #0d0f12;
            --card-bg: #161920;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success-green: #10b981;
            --warning-amber: #f59e0b;
        }

        html {
            scroll-padding-top: 120px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background-color: var(--dark-bg);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #161920;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo-text span {
            color: var(--gilded-brass);
        }

        .desktop-nav {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .nav-btn {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid #374151;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .nav-btn:hover {
            border-color: var(--gilded-brass);
            color: var(--gilded-brass-light);
        }

        .nav-btn.admin-unlocked {
            border-color: var(--success-green);
            color: var(--success-green);
            background-color: rgba(16, 185, 129, 0.05);
        }

        /* Accent Divider Line */
        .accent-divider {
            height: 3px;
            background: linear-gradient(90deg, var(--gilded-brass), #e2c07d, var(--gilded-brass));
            width: 100%;
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.3);
        }

        /* App Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2.5rem 5%;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .app-header h1 {
            font-size: 2rem;
            font-weight: 800;
        }

        .app-header h1 span {
            color: var(--gilded-brass);
        }

        .queue-stats {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .stat-badge {
            background-color: var(--card-bg);
            border: 1px solid #222630;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .stat-badge span {
            color: var(--text-main);
            font-weight: 700;
            margin-left: 0.25rem;
        }

        /* Admin-only stat badge */
        .admin-stat-only {
            display: none;
        }
        .admin-mode .admin-stat-only {
            display: inline-block;
        }

        /* Admin Status Control Bar */
        .admin-status-bar {
            background: linear-gradient(135deg, #161920, #1f2430);
            border: 1px solid var(--success-green);
            border-radius: 6px;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            display: none;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .admin-status-bar.visible {
            display: flex;
        }

        .status-controls {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .status-btn {
            background: transparent;
            border: 1px solid #374151;
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .status-btn.active.onduty { border-color: var(--success-green); color: var(--success-green); background: rgba(16, 185, 129, 0.15); }
        .status-btn.active.available { border-color: #3b82f6; color: #60a5fa; background: rgba(59, 130, 246, 0.1); }
        .status-btn.active.break { border-color: var(--warning-amber); color: var(--warning-amber); background: rgba(245, 158, 11, 0.1); }
        .status-btn.active.offcall { border-color: var(--bauer-red); color: var(--bauer-red); background: rgba(204, 0, 0, 0.1); }

        /* Dashboard Grid Layout */
        .dispatch-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            transition: all 0.3s ease;
        }

        .dispatch-grid.admin-mode {
            grid-template-columns: 1fr;
        }

        @media (max-width: 900px) {
            .dispatch-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Panel Styling */
        .panel {
            background-color: var(--card-bg);
            border: 1px solid #222630;
            border-radius: 6px;
            padding: 2rem;
        }

        .panel.admin-queue-panel {
            border-color: rgba(16, 185, 129, 0.3);
        }

        .panel h2 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid #222630;
            padding-bottom: 0.75rem;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            background-color: var(--dark-bg);
            border: 1px solid #374151;
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gilded-brass);
            box-shadow: 0 0 5px rgba(197, 160, 89, 0.2);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        .location-input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .gps-btn {
            background-color: rgba(197, 160, 89, 0.1);
            border: 1px solid var(--gilded-brass);
            color: var(--gilded-brass-light);
            padding: 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }

        .gps-btn:hover {
            background-color: rgba(197, 160, 89, 0.2);
        }

        .dispatch-submit-btn {
            width: 100%;
            background-color: var(--bauer-red);
            color: #ffffff;
            border: none;
            padding: 0.85rem;
            border-radius: 4px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(204, 0, 0, 0.4);
            transition: background-color 0.2s, transform 0.1s;
        }

        .dispatch-submit-btn:hover {
            background-color: var(--bauer-red-dark);
            transform: translateY(-1px);
        }

        /* Notification Banners Inside Form */
        .status-notice-box {
            background-color: rgba(59, 130, 246, 0.08);
            border: 1px solid #3b82f6;
            border-radius: 4px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: #93c5fd;
        }

        .status-notice-box.break-notice {
            background-color: rgba(245, 158, 11, 0.08);
            border-color: var(--warning-amber);
            color: #fde68a;
        }

        .off-call-box {
            background-color: rgba(204, 0, 0, 0.08);
            border: 1px solid var(--bauer-red);
            border-radius: 4px;
            padding: 1.5rem;
            text-align: center;
        }

        .off-call-box h3 {
            color: var(--bauer-red);
            margin-bottom: 0.75rem;
        }

        .off-call-box p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
        }

        /* Queue List Container */
        .queue-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 650px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .empty-queue {
            text-align: center;
            color: var(--text-muted);
            padding: 3rem 1rem;
            font-style: italic;
        }

        /* Customer's Personal Tracker Box */
        .my-ticket-banner {
            background: linear-gradient(135deg, #161920, #1f2430);
            border: 1px solid var(--gilded-brass);
            border-radius: 6px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .my-ticket-banner h3 {
            color: var(--gilded-brass);
            font-size: 1.05rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Ticket Item Card */
        .ticket-card {
            background-color: var(--dark-bg);
            border: 1px solid #222630;
            border-left: 4px solid var(--gilded-brass);
            border-radius: 4px;
            padding: 1.25rem;
            position: relative;
            transition: border-color 0.2s;
        }

        .ticket-card.status-dispatched {
            border-left-color: var(--warning-amber);
        }

        .ticket-card.status-completed {
            border-left-color: var(--success-green);
            opacity: 0.75;
        }

        .ticket-card.status-declined,
        .ticket-card.status-cancelled,
        .ticket-card.status-missed {
            border-left-color: var(--bauer-red);
            opacity: 0.7;
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .ticket-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .ticket-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .ticket-details {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .ticket-details p {
            margin-bottom: 0.25rem;
        }

        .ticket-details strong {
            color: var(--text-main);
        }

        .ticket-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            border-top: 1px solid #222630;
            padding-top: 0.75rem;
            flex-wrap: wrap;
        }

        .action-btn {
            background: transparent;
            border: 1px solid #374151;
            color: var(--text-main);
            padding: 0.3rem 0.75rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .action-btn:hover {
            border-color: var(--gilded-brass);
            color: var(--gilded-brass-light);
        }

        .action-btn.nav-map {
            border-color: var(--gilded-brass);
            color: var(--gilded-brass-light);
            background-color: rgba(197, 160, 89, 0.05);
        }

        .action-btn.danger:hover {
            border-color: var(--bauer-red);
            color: var(--bauer-red);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            background-color: #07080a;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid #161920;
            margin-top: 4rem;
        }
    </style>
</head>
<body id="pageBody">

    <!-- Header Navigation -->
    <header>
        <a href="index.html" class="logo-text">VEXCO <span>LLC</span></a>
        <div class="desktop-nav">
            <a href="index.html" class="nav-btn">← Back to Main Site</a>
            <button id="adminToggleBtn" class="nav-btn" onclick="toggleAdminMode()">🔒 Admin Login</button>
        </div>
    </header>

    <!-- Accent Divider Line -->
    <div class="accent-divider"></div>

    <!-- App Container -->
    <div class="container">
        
        <!-- Admin Status Control Bar (Visible only when unlocked) -->
        <div id="adminStatusBar" class="admin-status-bar">
            <div>
                <strong style="color: var(--text-main); display: block; font-size: 0.9rem;">Operational Status Control:</strong>
                <span id="currentStatusDisplay" style="color: var(--success-green); font-size: 0.85rem; font-weight: 600;">🟢 On Duty</span>
            </div>
            <div class="status-controls">
                <button class="status-btn active onduty" id="btnOnDuty" onclick="setOperationalStatus('On Duty')">🟢 On Duty</button>
                <button class="status-btn available" id="btnAvailable" onclick="setOperationalStatus('Available')">🔵 Available</button>
                <button class="status-btn break" id="btnBreak" onclick="setOperationalStatus('On Break')">🟡 On Break</button>
                <button class="status-btn offcall" id="btnOffCall" onclick="setOperationalStatus('Off Call')">🔴 Off Call</button>
            </div>
        </div>

        <div class="app-header">
            <h1 id="pageTitle">Service <span>Queue Status</span></h1>
            <div class="queue-stats">
                <div class="stat-badge">Active Dispatches: <span id="activeCount">0</span></div>
                <!-- Hidden from regular customers, visible only in admin mode -->
                <div class="stat-badge admin-stat-only">Shift Missed Calls: <span id="missedCallCount">0</span></div>
            </div>
        </div>

        <div id="dispatchGrid" class="dispatch-grid">
            
            <!-- Left Panel: Create New Ticket Form / Off-Call Panel (Hidden in Admin Mode) -->
            <div id="requestPanel" class="panel">
                <h2>⚡ Request Roadside Service</h2>
                <div id="formContainer">
                    <!-- Dynamic form or off-call message rendered via JS -->
                </div>
            </div>

            <!-- Right Panel: Queue List / Tracker -->
            <div id="queuePanel" class="panel">
                <h2 id="queuePanelTitle">📋 Current Workload Queue</h2>
                <div id="myActiveTicketContainer"></div>
                <div id="queueList" class="queue-list">
                    <div class="empty-queue">Connecting to database...</div>
                </div>
            </div>

        </div>

    </div>

    <!-- Hidden iframe for background Google Form submissions -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(window.submitted) { handleGoogleFormCompleted(); }"></iframe>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Vexco LLC Dispatch Console | Hot Springs, Arkansas</p>
    </footer>

    <!-- Firebase SDKs and Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBXb34v7m43Xe_Rw8rQER8NsoCc2698qGY",
            authDomain: "vexcoar.firebaseapp.com",
            projectId: "vexcoar",
            storageBucket: "vexcoar.firebasestorage.app",
            messagingSenderId: "40177338166",
            appId: "1:40177338166:web:1ce26e740838c5fa28d597",
            measurementId: "G-E0VE1KQDXC"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Admin State & Operational Status
        let isAdmin = false;
        const ADMIN_PASSWORD = "vexco2026"; 
        let currentOperationalStatus = 'On Duty';

        // Background Reminder Timer Tracking
        let lastStatusChangeTime = Date.now();
        let reminderIntervalId = null;

        window.toggleAdminMode = function() {
            const requestPanel = document.getElementById('requestPanel');
            const dispatchGrid = document.getElementById('dispatchGrid');
            const queuePanel = document.getElementById('queuePanel');
            const adminStatusBar = document.getElementById('adminStatusBar');
            const pageBody = document.getElementById('pageBody');

            if (!isAdmin) {
                const pwd = prompt("Enter Admin Password:");
                if (pwd === ADMIN_PASSWORD) {
                    isAdmin = true;
                    document.getElementById('adminToggleBtn').textContent = "🔓 Admin Unlocked";
                    document.getElementById('adminToggleBtn').classList.add('admin-unlocked');
                    document.getElementById('pageTitle').innerHTML = 'Admin <span>Live Dispatch Console</span>';
                    document.getElementById('queuePanelTitle').innerHTML = '📋 Admin Master Control Queue';
                    
                    adminStatusBar.classList.add('visible');
                    requestPanel.style.display = 'none'; // Completely hide request form when admin is logged in
                    dispatchGrid.classList.add('admin-mode'); 
                    queuePanel.classList.add('admin-queue-panel');
                    pageBody.classList.add('admin-mode'); // Triggers CSS to show the missed-calls badge

                    alert("Admin access granted.");
                } else if (pwd !== null) {
                    alert("Incorrect password.");
                }
            } else {
                isAdmin = false;
                document.getElementById('adminToggleBtn').textContent = "🔒 Admin Login";
                document.getElementById('adminToggleBtn').classList.remove('admin-unlocked');
                document.getElementById('pageTitle').innerHTML = 'Service <span>Queue Status</span>';
                document.getElementById('queuePanelTitle').innerHTML = '📋 Current Workload Queue';
                
                adminStatusBar.classList.remove('visible');
                requestPanel.style.display = 'block'; // Show request form for customers
                dispatchGrid.classList.remove('admin-mode');
                queuePanel.classList.remove('admin-queue-panel');
                pageBody.classList.remove('admin-mode'); // Hides the missed-calls badge from customer view

                alert("Admin access locked.");
            }
            renderRequestFormState();
            if (window.latestTickets) {
                renderQueue(window.latestTickets);
            }
        };

        // Listen for Operational Status from Firebase
        onSnapshot(doc(db, "config", "operational_status"), (docSnap) => {
            if (docSnap.exists()) {
                currentOperationalStatus = docSnap.data().status || 'On Duty';
            } else {
                setDoc(doc(db, "config", "operational_status"), { status: 'On Duty' });
            }
            lastStatusChangeTime = Date.now(); // Reset reminder timer on status change
            updateStatusUIButtons();
            renderRequestFormState();
            if (window.latestTickets) {
                renderQueue(window.latestTickets);
            }
        });

        // Set Operational Status in Firestore
        window.setOperationalStatus = async function(status) {
            try {
                await setDoc(doc(db, "config", "operational_status"), { status: status });
            } catch (e) {
                console.error("Error setting operational status:", e);
            }
        };

        function updateStatusUIButtons() {
            document.getElementById('btnOnDuty').className = `status-btn onduty ${currentOperationalStatus === 'On Duty' ? 'active' : ''}`;
            document.getElementById('btnAvailable').className = `status-btn available ${currentOperationalStatus === 'Available' ? 'active' : ''}`;
            document.getElementById('btnBreak').className = `status-btn break ${currentOperationalStatus === 'On Break' ? 'active' : ''}`;
            document.getElementById('btnOffCall').className = `status-btn offcall ${currentOperationalStatus === 'Off Call' ? 'active' : ''}`;
            
            let displayElem = document.getElementById('currentStatusDisplay');
            if (currentOperationalStatus === 'On Duty') {
                displayElem.textContent = "🟢 On Duty (In staging zone)";
                displayElem.style.color = "var(--success-green)";
            } else if (currentOperationalStatus === 'Available') {
                displayElem.textContent = "🔵 Available (Outside primary staging zone)";
                displayElem.style.color = "#60a5fa";
            } else if (currentOperationalStatus === 'On Break') {
                displayElem.textContent = "🟡 On Break (Accepting with delay notices)";
                displayElem.style.color = "var(--warning-amber)";
            } else if (currentOperationalStatus === 'Off Call') {
                displayElem.textContent = "🔴 Off Call (Form locked, Missed Opportunity mode active)";
                displayElem.style.color = "var(--bauer-red)";
            }
        }

        // Render Request Form Based on Operational Status
        function renderRequestFormState() {
            const container = document.getElementById('formContainer');

            if (currentOperationalStatus === 'Off Call') {
                container.innerHTML = `
                    <div class="off-call-box">
                        <h3>🔴 Vexco LLC is Currently Off Call</h3>
                        <p>We are not taking active dispatches right now. If you needed assistance, please click below to log your request. This helps us track peak demand times so we can adjust our future operating hours!</p>
                        <button type="button" class="dispatch-submit-btn" onclick="logMissedOpportunity()">Log Missed Service Request</button>
                    </div>
                `;
                return;
            }

            let noticeHtml = '';
            if (currentOperationalStatus === 'Available') {
                noticeHtml = `<div class="status-notice-box">ℹ️ <strong>Notice:</strong> Technician is currently not in the proper staging zone. Response might take a minute while en route.</div>`;
            } else if (currentOperationalStatus === 'On Break') {
                noticeHtml = `<div class="status-notice-box break-notice">⚠️ <strong>Notice:</strong> Technician is currently <strong>On Break</strong>. Service requests can still be submitted, but response times will be delayed.</div>`;
            }

            container.innerHTML = `
                ${noticeHtml}
                <form id="dispatchForm">
                    <div class="form-group">
                        <label for="clientName">Your Name</label>
                        <input type="text" id="clientName" class="form-control" placeholder="e.g., John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="clientPhone">Phone Number</label>
                        <input type="tel" id="clientPhone" class="form-control" placeholder="e.g., 501-555-0199" required>
                    </div>

                    <div class="form-group">
                        <label for="serviceType">Service Required</label>
                        <select id="serviceType" class="form-control" required>
                            <option value="Jump Start ($35)">⚡ Jump Start ($35.00)</option>
                            <option value="Flat Tire Change ($50)">🛞 Flat Tire Change ($50.00)</option>
                            <option value="Vehicle Lockout ($25)">🔓 Vehicle Lockout ($25.00)</option>
                            <option value="Diagnostic Troubleshooting ($25)">🔍 Diagnostic Troubleshooting ($25.00)</option>
                            <option value="Liner Fastening ($15)">🔧 Liner Fastening ($15.00)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="location">Location / GPS Coordinates</label>
                        <div class="location-input-group">
                            <button type="button" class="gps-btn" onclick="captureGPS()">📍 Use Current GPS Location</button>
                            <input type="text" id="location" class="form-control" placeholder="e.g., 34.5199, -93.0508 or Walmart Parking Lot" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="vehicleInfo">Vehicle Make / Model / Color</label>
                        <input type="text" id="vehicleInfo" class="form-control" placeholder="e.g., 1999 Toyota Camry (Gold)" required>
                    </div>

                    <div class="form-group">
                        <label for="notes">Additional Notes / Landmarks</label>
                        <textarea id="notes" class="form-control" placeholder="Any special details or landmarks..."></textarea>
                    </div>

                    <button type="submit" class="dispatch-submit-btn">Submit Service Request</button>
                </form>
            `;

            document.getElementById('dispatchForm').addEventListener('submit', handleFormSubmit);
        }

        // Geolocation Capture Function
        window.captureGPS = function() {
            const locationInput = document.getElementById('location');
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }

            locationInput.value = "Acquiring GPS coordinates...";
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lng = position.coords.longitude.toFixed(6);
                    locationInput.value = `${lat}, ${lng}`;
                },
                (error) => {
                    console.error("GPS Error:", error);
                    alert("Unable to retrieve your location. Please enter it manually or check permissions.");
                    locationInput.value = "";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        };

        // Handle Form Submission (Firestore + Background Google Form Backup)
        async function handleFormSubmit(event) {
            event.preventDefault();

            let statusText = 'Pending';
            if (currentOperationalStatus === 'On Break') statusText = 'Pending (On Break)';
            else if (currentOperationalStatus === 'Available') statusText = 'Pending (Available - Out of Zone)';

            const clientName = document.getElementById('clientName').value;
            const clientPhone = document.getElementById('clientPhone').value;
            const serviceType = document.getElementById('serviceType').value;
            const locationVal = document.getElementById('location').value;
            const vehicleInfo = document.getElementById('vehicleInfo').value;
            const notesVal = document.getElementById('notes').value;

            const newTicket = {
                name: clientName,
                phone: clientPhone,
                service: serviceType,
                location: locationVal,
                vehicle: vehicleInfo,
                notes: notesVal,
                status: statusText,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                createdAt: Date.now()
            };

            try {
                // 1. Primary Firestore Database Save
                const docRef = await addDoc(collection(db, "tickets"), newTicket);
                localStorage.setItem('vexco_my_ticket_id', docRef.id);

                // 2. Background Google Form Submission Backup 
                const googleFormUrl = "https://docs.google.com/forms/u/0/d/e/1FAIpQLSc.../formResponse"; 
                const formElement = document.createElement('form');
                formElement.action = googleFormUrl;
                formElement.method = "POST";
                formElement.target = "hidden_iframe";

                const formDataMapping = {
                    "entry.111111111": clientName,
                    "entry.222222222": clientPhone,
                    "entry.333333333": serviceType,
                    "entry.444444444": locationVal,
                    "entry.555555555": vehicleInfo,
                    "entry.666666666": notesVal
                };

                for (const [key, val] of Object.entries(formDataMapping)) {
                    const input = document.createElement('input');
                    input.type = "hidden";
                    input.name = key;
                    input.value = val;
                    formElement.appendChild(input);
                }

                document.body.appendChild(formElement);
                window.submitted = true;
                formElement.submit();
                document.body.removeChild(formElement);

                alert("Service request submitted successfully! Tracking your active request below.");
                if (window.latestTickets) {
                    renderQueue(window.latestTickets);
                }
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("Error adding ticket to database. Check console details.");
            }
        }

        window.handleGoogleFormCompleted = function() {
            console.log("Background Google Form submission completed successfully.");
        };

        // Log Missed Opportunity when Off Call
        window.logMissedOpportunity = async function() {
            const name = prompt("Your Name (Optional):") || "Anonymous Driver";
            const service = prompt("What service did you need? (e.g., Jump Start, Flat Tire):") || "General Roadside Help";
            
            const missedTicket = {
                name: name,
                phone: "N/A (Off-Call Log)",
                service: `[Missed] ${service}`,
                location: "Hot Springs Area",
                vehicle: "Not Provided",
                notes: "Logged while off-call to help determine peak service hours.",
                status: 'Missed Opportunity',
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                createdAt: Date.now()
            };

            try {
                await addDoc(collection(db, "tickets"), missedTicket);
                
                // Increment Shift Missed Calls counter in localStorage
                let currentMissed = parseInt(localStorage.getItem('vexco_shift_missed_calls') || '0', 10) + 1;
                localStorage.setItem('vexco_shift_missed_calls', currentMissed);
                updateMissedCallDisplay();

                alert("Thank you! Your missed request has been logged. This data directly helps us optimize our operating hours.");
            } catch (e) {
                console.error("Error logging missed opportunity:", e);
                alert("Error recording data. Please try again.");
            }
        };

        function updateMissedCallDisplay() {
            const count = localStorage.getItem('vexco_shift_missed_calls') || '0';
            const badge = document.getElementById('missedCallCount');
            if (badge) badge.textContent = count;
        }

        // Update Ticket Status
        window.updateStatus = async function(id, newStatus) {
            try {
                const ticketRef = doc(db, "tickets", id);
                await updateDoc(ticketRef, { status: newStatus });
            } catch (e) {
                console.error("Error updating status: ", e);
            }
        };

        // Customer Cancel Their Own Ticket
        window.cancelMyRequest = async function(id) {
            if (confirm("Are you sure you want to cancel your service request? (Select OK if another person helped you out)")) {
                try {
                    const ticketRef = doc(db, "tickets", id);
                    await updateDoc(ticketRef, { 
                        status: 'Cancelled',
                        notes: 'Cancelled by customer (Assisted elsewhere)'
                    });
                } catch (e) {
                    console.error("Error cancelling ticket: ", e);
                }
            }
        };

        // Admin Decline Ticket with Reason
        window.declineTicket = async function(id) {
            let choice = prompt(
                "Select decline reason number:\n" +
                "1. Customer is no longer at location / Gone\n" +
                "2. Outside service range (Too far from Hot Springs)\n" +
                "3. Unable to reach customer via phone\n" +
                "4. Type custom reason"
            );

            if (!choice) return;

            let declineReason = "";
            if (choice === "1") declineReason = "Declined: Customer is no longer at location";
            else if (choice === "2") declineReason = "Declined: Outside Hot Springs service range";
            else if (choice === "3") declineReason = "Declined: Unable to reach customer by phone";
            else if (choice === "4") {
                declineReason = prompt("Enter custom decline reason:") || "Declined by admin";
            } else {
                return;
            }

            try {
                const ticketRef = doc(db, "tickets", id);
                await updateDoc(ticketRef, { 
                    status: 'Declined',
                    notes: declineReason
                });
            } catch (e) {
                console.error("Error declining ticket:", e);
            }
        };

        // Firestore Real-Time Queue Listener
        const q = query(collection(db, "tickets"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const tickets = [];
            snapshot.forEach((docSnap) => {
                tickets.push({ id: docSnap.id, ...docSnap.data() });
            });
            window.latestTickets = tickets;
            renderQueue(tickets);
        });

        // Render Queue & Active Counters
        function renderQueue(tickets) {
            const queueList = document.getElementById('queueList');
            const activeCountElem = document.getElementById('activeCount');
            const myTicketContainer = document.getElementById('myActiveTicketContainer');

            updateMissedCallDisplay();

            // Filter active dispatches (Pending or Dispatched)
            const activeTickets = tickets.filter(t => t.status && (t.status.startsWith('Pending') || t.status.startsWith('Dispatched')));
            activeCountElem.textContent = activeTickets.length;

            if (tickets.length === 0) {
                queueList.innerHTML = `<div class="empty-queue">No service requests in the queue.</div>`;
                myTicketContainer.innerHTML = '';
                return;
            }

            // Render Customer's Personal Ticket Tracker if saved in localStorage
            const myTicketId = localStorage.getItem('vexco_my_ticket_id');
            let myTicketHtml = '';
            const myTicket = tickets.find(t => t.id === myTicketId);

            if (myTicket && !isAdmin) {
                let statusColor = 'var(--gilded-brass)';
                if (myTicket.status.includes('Completed')) statusColor = 'var(--success-green)';
                else if (myTicket.status.includes('Declined') || myTicket.status.includes('Cancelled')) statusColor = 'var(--bauer-red)';

                myTicketHtml = `
                    <div class="my-ticket-banner">
                        <h3>Your Active Request Tracker <span style="color: ${statusColor};">${myTicket.status}</span></h3>
                        <div class="ticket-details">
                            <p><strong>Service:</strong> ${myTicket.service}</p>
                            <p><strong>Location:</strong> ${myTicket.location}</p>
                            <p><strong>Vehicle:</strong> ${myTicket.vehicle}</p>
                        </div>
                        ${(myTicket.status.startsWith('Pending')) ? `<button class="action-btn danger" onclick="cancelMyRequest('${myTicket.id}')">Cancel Request</button>` : ''}
                    </div>
                `;
            }
            myTicketContainer.innerHTML = myTicketHtml;

            // Render Master Queue List
            let html = '';
            tickets.forEach(ticket => {
                let statusClass = '';
                if (ticket.status.includes('Dispatched')) statusClass = 'status-dispatched';
                else if (ticket.status.includes('Completed')) statusClass = 'status-completed';
                else if (ticket.status.includes('Declined')) statusClass = 'status-declined';
                else if (ticket.status.includes('Cancelled')) statusClass = 'status-cancelled';
                else if (ticket.status.includes('Missed')) statusClass = 'status-missed';

                let mapsLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ticket.location)}`;

                html += `
                    <div class="ticket-card ${statusClass}">
                        <div class="ticket-header">
                            <div class="ticket-title">${ticket.name} — <span style="color: var(--gilded-brass);">${ticket.service}</span></div>
                            <div class="ticket-time">${ticket.timestamp}</div>
                        </div>
                        <div class="ticket-details">
                            <p><strong>Phone:</strong> <a href="tel:${ticket.phone}" style="color: #60a5fa; text-decoration: none;">${ticket.phone}</a></p>
                            <p><strong>Location:</strong> ${ticket.location}</p>
                            <p><strong>Vehicle:</strong> ${ticket.vehicle}</p>
                            ${ticket.notes ? `<p><strong>Notes:</strong> ${ticket.notes}</p>` : ''}
                            <p><strong>Status:</strong> <span style="font-weight: 600;">${ticket.status}</span></p>
                        </div>
                        <div class="ticket-actions">
                            <a href="${mapsLink}" target="_blank" class="action-btn nav-map">🗺️ Open GPS Map</a>
                            ${isAdmin ? `
                                <button class="action-btn" onclick="updateStatus('${ticket.id}', 'Dispatched')">⚡ Set Dispatched</button>
                                <button class="action-btn" onclick="updateStatus('${ticket.id}', 'Completed')">✅ Complete</button>
                                <button class="action-btn danger" onclick="declineTicket('${ticket.id}')">❌ Decline</button>
                            ` : ''}
                        </div>
                    </div>
                `;
            });

            queueList.innerHTML = html;
        }

        // Background Status Reminder Timer Check (Reminds if left on Break or Available for > 30 minutes)
        function checkStatusReminders() {
            if (!isAdmin) return;
            const elapsedMinutes = (Date.now() - lastStatusChangeTime) / 60000;
            if ((currentOperationalStatus === 'On Break' || currentOperationalStatus === 'Available') && elapsedMinutes >= 30) {
                console.warn(`Reminder: Status has been set to '${currentOperationalStatus}' for over 30 minutes.`);
            }
        }

        // Run reminder check every minute
        setInterval(checkStatusReminders, 60000);
    </script>
</body>
</html>
